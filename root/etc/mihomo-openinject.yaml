tun:
  enable: true
  stack: system
  mtu: 1500
  auto-route: true
  auto-redir: false
  dns-hijack:
    - any:53

mixed-port: 7899
allow-lan: true
mode: rule
log-level: info
find-process-mode: always

# DNS internal mihomo: port 5353 (target hijack dnsmasq)
dns:
  enable: true
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # Domain connectivity check jangan pakai fake-IP, biar Windows/Android deteksi internet normal
  fake-ip-filter:
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.connectivitycheck.gstatic.com'
    - '+.connectivitycheck.platform.hicloud.com'
    - '+.connectivitycheck.platform.hihonorcloud.com'
    - '+.captive.apple.com'
    - '+.network-test.ubuntu.com'
    - '+.detectportal.firefox.com'
    - '+.nmcheck.gnome.org'
    - '+.ping.archlinux.org'
    - '+.cp.cloudflare.com'
    - '+.bing.com'
    - '+.www.bing.com'

proxies:
  - name: oi-socks
    type: socks5
    server: 127.0.0.1
    port: 1081
    udp: false

proxy-groups:
  - name: OPENINJECT
    type: select
    proxies:
      - oi-socks

rules:
  # Blokir seluruh UDP keluar (kecuali DNS port 53 yang ditangani dns internal)
  - NETWORK,udp,REJECT
  - MATCH,OPENINJECT
