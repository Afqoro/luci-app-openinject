tun:
  enable: true
  stack: system
  mtu: 1500
  auto-route: true
  auto-redir: false
  dns-hijack:
    - any:53

mixed-port: 7899
allow-lan: true
mode: rule
log-level: info
find-process-mode: always

# DNS internal mihomo: port 5353 (target hijack dnsmasq)
dns:
  enable: true
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

proxies:
  - name: oi-socks
    type: socks5
    server: 127.0.0.1
    port: 1081
    udp: true

proxy-groups:
  - name: OPENINJECT
    type: select
    proxies:
      - oi-socks

rules:
  - MATCH,OPENINJECT
